# Team override for bmad-build. Written 2026-09-11 so every Build run uses
# Ponytail, the ECC skills, Graphify and context-mode; the Emil design skills
# were added 2026-09-15.
#
# Merges over .claude/skills/bmad-build/customize.toml: lists append to the
# shipped list, strings replace the shipped value, [[workflow.review_layers]]
# merge by id (the three shipped layers stay; the three below are added).
# Verify the merge with:
#   uv run _bmad/scripts/resolve_customization.py --skill .claude/skills/bmad-build --key workflow
#
# What each tool is on this machine, and the record of the decision:
#   Ponytail      plugin ponytail@ponytail. Its rules text arrives through the
#                 plugin's SessionStart, SubagentStart and UserPromptSubmit
#                 hooks, and Constitution rule 5 states the same ladder. The
#                 `ponytail-review` skill is a review layer below.
#   ECC           workflow-quality module only, installed to ~/.claude/skills/
#                 with no rules, commands, agents or hooks. Build uses
#                 `verification-loop` (review layer) and `agent-self-evaluation`
#                 (on_complete). The other ECC skills are on demand.
#   Graphify      CLI 0.9.58 plus ~/.claude/skills/graphify. The graph lives in
#                 graphify-out/ (gitignored) and is refreshed on activation.
#   context-mode  plugin context-mode@context-mode. Its hooks route Bash, Read,
#                 Grep, WebFetch and Agent output through its sandbox in every
#                 session, so Build inherits it; the activation step only makes
#                 that visible.
#   Emil skills   emilkowalski/skills, installed to ~/.claude/skills/ by
#                 `npx skills add`. Build invokes `animate` before writing
#                 motion (persistent fact) and runs `review-animations` as a
#                 review layer gated to diffs that touch motion. That skill is
#                 marked disable-model-invocation, so the layer reads its files
#                 instead of invoking it. `apple-design` and `mobile-native`
#                 are on demand; the other nine in that repository were judged
#                 redundant or off-stack and are not installed. The standing
#                 audit is review-apple-design-2026-09-15.md beside EXPERIENCE.md.
#
# Constitution rule order still holds: a tool recommendation never outranks
# this repository's AGENTS.md. Where an ECC skill's generic commands differ from
# the verified ones (corepack, --run, no lint gate), the layer text below says so.

[workflow]

activation_steps_prepend = [
  """Graphify: run `graphify update .` from the repository root. It is incremental and AST only (no LLM), and it also builds the graph from nothing. Report its one-line node and edge count. If `graphify` is not on PATH, say so in one line and continue without the graph; it is an aid to investigation, not a gate.""",
  """context-mode: if the `mcp__plugin_context-mode_context-mode__ctx_*` tools are available, route long command output, large file reads and web fetches through them for the whole run, as the routing injected at session start instructs. If they are absent, say so in one line and continue; do not install or repair anything mid-run.""",
]

persistent_facts = [
  """Ponytail is on for this run. Apply its ladder before adding any file, dependency, abstraction, helper, config or feature: does it need to exist, is it already in this codebase, does the standard library do it, does the platform do it, does an installed dependency do it, is it one line. Only then write the smallest thing that works. Correctness, validation, error handling, accessibility and security are never what gets cut.""",
  """Graphify is the first stop for structural questions. In step 2 (Investigate codebase) query the graph before reading files: `graphify query "<question>"` for how something is wired, `graphify affected "<symbol>"` for what a change reaches, `graphify path "A" "B"` for the chain between two symbols, `graphify explain "X"` for one node. Cite the `src=` locations it returns in the Code Map, then read only the files it named. If the graph has nothing on a topic, fall back to reading.""",
  """ECC skills are installed at user level (~/.claude/skills/, workflow-quality module). Build runs `verification-loop` as a review layer and `agent-self-evaluation` on completion; any other ECC skill is on demand only. When an ECC skill's generic commands differ from this repository's verified ones in AGENTS.md, the verified ones win.""",
  """Emil design skills are installed at user level (~/.claude/skills/). When the spec adds or changes motion (a transition, an enter or exit, a disclosure, an entrance timeline), invoke the `animate` skill before writing it and follow its decision order: should it animate at all, what purpose, which tool, which properties, which curve and duration, how it interrupts, how it exits. This repository's design spec outranks the skill where they disagree, and the spec's decisions are not defects: the motion vocabulary is `contracts/tokens.css` (`--dur-micro`, `--dur-minor`, `--dur-major`, `--dur-exit`, `--ease-entrance`, `--ease-exit`, `--ease-toggle`), never a literal and never a new motion dependency (GSAP is installed; no Motion, Framer Motion or spring library); transform and opacity only, with the disclosure's height tween as the one named exception (`EXPERIENCE.md` § Work item); one orchestrated entrance per page load and no scroll-triggered fade-up (`EXPERIENCE.md` § Motion); no bounce, overshoot or gesture; no `:active` treatment (`RESTYLE-SPEC.md` § 1 States); no alpha ground or `backdrop-filter` outside `--c-scrim` (`DESIGN.md` § Rules); and `prefers-reduced-motion` read in JS for every GSAP duration, because the contract's 1ms collapse reaches CSS only. `apple-design` (typography, reduced motion, the eight foundations) and `mobile-native` (anything a thumb touches) are on demand. The standing audit is `review-apple-design-2026-09-15.md` beside `EXPERIENCE.md`.""",
]

implementation_handoff = """
Launch a subagent with no prior conversation context, with this prompt:

> Read {spec_file} fully and implement it: the spec is the sole source of truth. Load every file listed in its frontmatter `context:` before you start.
>
> Before changing a symbol that has callers outside the spec's `context:` list, run `graphify affected "<symbol>"` from the repository root and read what it names. If `graphify` is unavailable, say so once and continue.
>
> When done, report what you changed, how you verified it, and anything left incomplete or risky.
"""

on_complete = """
Invoke the `agent-self-evaluation` skill on this Build run: score the completed spec and implementation on its five axes with concrete evidence per criterion, and append the scorecard with its ranked improvements to the completion summary. Do not re-run any verification for it.
"""

[[workflow.review_layers]]
id = "ponytail-review"
name = "Ponytail Review"
instruction = """
Launch a context-free subagent with this prompt:

Invoke the `ponytail-review` skill and apply it to the diff below exactly as that skill specifies: one line per finding in its `L<line>: <tag> <what>. <replacement>.` format (or `<file>:L<line>: ...` across files), tags `delete:`, `stdlib:`, `native:`, `yagni:` and `shrink:` only, ending with `net: -<N> lines possible.` or `Lean already. Ship.` Over-engineering only; correctness, security and performance belong to the other layers.

Review content:

{diff_output}

If the skill is unavailable, report that exact failure and stop. Return only the review result.
"""

[[workflow.review_layers]]
id = "ecc-verification-loop"
name = "ECC Verification Loop"
instruction = """
Launch a context-free subagent with this prompt:

Invoke the `verification-loop` skill and run its phases against the current worktree, substituting this repository's verified commands for the skill's generic ones: build `corepack pnpm build`, types `corepack pnpm typecheck`, tests `corepack pnpm test --run` (never without `--run`; the full suite takes about two minutes, run all of it). There is no lint gate in this repository, so report Lint as `N/A (no lint command, see AGENTS.md)` rather than FAIL. Skip the coverage threshold and report the test totals instead. For the diff phase use the diff below, not `git diff HEAD~1`. Produce the skill's VERIFICATION REPORT with real command output excerpts. Never report a PASS you did not observe.

Diff under review:

{diff_output}

If the skill is unavailable, report that exact failure and stop. Return only the verification report.
"""

[[workflow.review_layers]]
id = "emil-review-animations"
name = "Animation Review"
instruction = """
Launch a context-free subagent with this prompt:

First decide whether this layer applies. Scan the diff below for motion: `transition`, `animat`, `@keyframes`, `transform`, `gsap`, `ScrollTrigger`, `lenis`, `--dur-`, `--ease-`, `motion` or `useReduceMotion`. If none of these appears in an added or changed line, return exactly `No motion in this diff. Animation review skipped.` and stop.

Otherwise read `~/.claude/skills/review-animations/SKILL.md` and `~/.claude/skills/review-animations/STANDARDS.md` (under the user's home directory: resolve `~` to `$HOME` or `%USERPROFILE%` before reading; the skill is user-invocable only, so read the files rather than invoking it) and apply them to the diff exactly as written: the Before / After / Why findings table, then the tiered verdict ending in Block or Approve, citing `file:line`. Two house rules narrow the standard. First, a duration, curve or behaviour that this repository's design spec sets is a settled decision: name it and do not report it. The spec is `EXPERIENCE.md` § Motion and § Work item, `RESTYLE-SPEC.md` § 1 States and `DESIGN.md` § Rules under `_bmad-output/planning-artifacts/ux-designs/ux-cuatro-portfolio-2026-08-15/`, and its settled decisions include no `:active` treatment, no bounce or overshoot, no alpha ground, the disclosure's height tween as the one layout-property animation, and the published `--ease-exit` curve. Second, every proposed fix must reuse the repository's motion tokens (`--dur-micro`, `--dur-minor`, `--dur-major`, `--dur-exit`, `--ease-entrance`, `--ease-exit`, `--ease-toggle` in `contracts/tokens.css`), never introduce a literal, and never add a motion dependency. Motion only; correctness, security and performance outside motion belong to the other layers.

Diff under review:

{diff_output}

If the skill files are unavailable, report that exact failure and stop. Return only the review result.
"""
