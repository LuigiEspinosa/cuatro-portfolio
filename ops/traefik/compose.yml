# Traefik, the estate's proxy (Stories 4-2 and 4-11, AD-7, AD-26). It holds 80 and 443 itself: 443 for every
# public hostname over TLS with the Origin CA certificate, 80 for plain HTTP, which it redirects to https.
# Story 4-11 retires the shared Caddy that held those two ports before it, and the Cloudflare Origin Rules
# that sent each hostname to 8443 while the two ran side by side (`ops/caddy-retirement.md`). Until that
# runbook's step 4 starts this file's service, the box runs Story 4-2's 8443 instance.
#
# Not a service of the Anchor's `docker-compose.yml`: that file's suite forbids published ports, and this
# stack is started by hand from `ops/caddy-retirement.md`, never by a deploy. Run from the checkout:
#   docker compose -f ops/traefik/compose.yml up -d
#
# The service is `ingress`, not `traefik`: Story 4-2's 8443 instance was this project's `traefik` service, and
# the new one had to run beside it while the Origin Rules were deleted one at a time, so the two needed
# different names (`ops/caddy-retirement.md` § Why two instances at once).
#
# No Docker socket is mounted. Routing is the file provider alone, `dynamic/`, so a container cannot
# change what Traefik routes and Traefik cannot read or start containers.
name: traefik

services:
  ingress:
    # Exact patch pinned: v3.7.13 was current on 2026-09-30 (`gh api repos/traefik/traefik/releases`,
    # re-read by Story 4-2 after Story 4-1's refresh).
    image: traefik:v3.7.13
    ports:
      # Every address, both families. The origin firewall admits Cloudflare's ranges only on 80 and 443
      # (`/usr/local/sbin/cf-origin-firewall.sh`). Host and container port are the same number on purpose:
      # `DOCKER-USER` matches the port after DNAT, which is the container's.
      - '80:80'
      - '443:443'
      # The dashboard, on loopback only, reached over an SSH tunnel. Never published publicly. 8081 on the
      # host because the 8443 instance held 127.0.0.1:8080 while this one started beside it.
      - '127.0.0.1:8081:8080'
    env_file:
      # Gitignored (`.env` anywhere). Names only here; values are the Operator's (`ops/traefik-cutover.md`
      # step 2).
      - .env
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      # A directory, not a file: `git reset --hard` on deploy replaces files by rename, and a single-file
      # bind would keep serving the old inode. Traefik watches this directory.
      - ./dynamic:/etc/traefik/dynamic:ro
      # The Cloudflare Origin CA certificate and key, from Traefik's own volume, which
      # `ops/caddy-retirement.md` fills from the box's `/home/deploy/origin-ca/` copy. External, so no
      # `down -v` of this project can remove it.
      - origin-ca:/etc/traefik/origin-ca:ro
      # The DNS-01 resolver's account and certificates.
      - acme:/acme
    networks:
      # Every upstream answers here under the alias `ops/routing-inventory.md` § The shared network names.
      - cs-tracker_default
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # The dashboard's ForwardAuth (Story 5.6, AD-11): oauth2-proxy as the OIDC client `traefik` of the estate's
  # issuer, found through discovery and named by no provider (FR-23). Under a profile, so the plain `up -d`
  # above never starts it; `ops/identity-issuer.md` § The Traefik dashboard behind ForwardAuth starts it with
  # `--profile forward-auth`. It stores nothing: the session is an encrypted cookie in the browser. The
  # values come from the gitignored `.env` by interpolation, and an empty one stops it at start.
  forward-auth:
    # v7.15.5, 2026-10-01, the first release outside GHSA-63jm-59jj-478j and GHSA-wr5q-7wxw-x568 (both
    # critical). MIT. Pinned by the multi-platform index digest, read 2026-10-02.
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
    profiles: [forward-auth]
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OIDC_ISSUER:-}
      OAUTH2_PROXY_CLIENT_ID: ${TRAEFIK_OIDC_CLIENT_ID:-}
      OAUTH2_PROXY_CLIENT_SECRET: ${TRAEFIK_OIDC_CLIENT_SECRET:-}
      OAUTH2_PROXY_COOKIE_SECRET: ${TRAEFIK_FORWARD_AUTH_COOKIE_SECRET:-}
      OAUTH2_PROXY_SCOPE: openid email profile
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      # The SSH tunnel's local end, `ssh -N -L 8080:127.0.0.1:8081`; the issuer holds this redirect URI.
      OAUTH2_PROXY_REDIRECT_URL: http://localhost:8080/oauth2/callback
      OAUTH2_PROXY_WHITELIST_DOMAINS: localhost:8080
      # Only the Owner: one address, from `.env`, as a file the service reads (no flag takes a single email).
      OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE: /etc/forward-auth/owner-email
      # Host-only `__Host-` session, never a Domain (AD-11), eight hours as the Hub's.
      OAUTH2_PROXY_COOKIE_NAME: __Host-traefik-dashboard
      OAUTH2_PROXY_COOKIE_SECURE: 'true'
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_COOKIE_EXPIRE: 8h
      OAUTH2_PROXY_COOKIE_REFRESH: '0'
      # Traefik's ForwardAuth asks with X-Forwarded-Host and X-Forwarded-Uri; a 202 admits the request.
      OAUTH2_PROXY_REVERSE_PROXY: 'true'
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: 'true'
    configs:
      - source: forward-auth-owner-email
        target: /etc/forward-auth/owner-email
    networks:
      - cs-tracker_default
    restart: unless-stopped

configs:
  forward-auth-owner-email:
    content: ${TRAEFIK_OIDC_OWNER_EMAIL:-}

networks:
  cs-tracker_default:
    external: true

volumes:
  origin-ca:
    external: true
    name: traefik-origin-ca
  acme:
