# Traefik's routing (Story 4-2, AD-7): one router per hostname the box serves, each matching on Host.
# PathPrefix never routes between applications. It appears once, to split library.cuatro.dev between
# digital-library's own two containers, under that hostname's Host, exactly as the shared Caddyfile's
# library block does. Upstreams are the aliases on `cs-tracker_default` that the shared Caddyfile proxies
# until `ops/caddy-retirement.md` retires it (`ops/routing-inventory.md` § The shared network).
#
# `ops/__tests__/traefik-config.test.ts` reads this file as indented text: routers are four spaces in,
# their keys six, and every rule is one line. Keep that shape.
#
# This file is served from the box checkout, which a deploy resets to `main`: a change merged there
# reaches the running Traefik on the next deploy, because the directory is watched.

http:
  routers:
    cuatro-portfolio:
      rule: Host(`cuatro.dev`)
      entryPoints: [websecure]
      middlewares: [house-headers]
      service: cuatro-portfolio
      tls: {}
    # The apex is canonical; www redirects there with the path and query kept. Caddy answers 301 to every
    # method; `permanent: true` answers 301 to GET only and 308 to HEAD, POST and the rest, and Traefik has
    # no setting for 301 on those (`ops/traefik-cutover.md` § What the move changes).
    www:
      rule: Host(`www.cuatro.dev`)
      entryPoints: [websecure]
      middlewares: [house-headers, www-to-apex]
      service: noop@internal
      tls: {}
    analytics:
      rule: Host(`analytics.cuatro.dev`)
      entryPoints: [websecure]
      middlewares: [house-headers]
      service: analytics
      tls: {}
    # Caddy's cs-tracker block sends no security headers (`ops/routing-inventory.md`); carried over as is.
    # The one middleware makes the forwarded scheme what Caddy sends (Story 4-10, `forwarded-proto-https`).
    cs-tracker:
      rule: Host(`cs-tracker.cuatro.dev`)
      entryPoints: [websecure]
      middlewares: [forwarded-proto-https]
      service: cs-tracker
      tls: {}
    cuatro-tracker:
      rule: Host(`tracker.cuatro.dev`)
      entryPoints: [websecure]
      middlewares: [house-headers]
      service: cuatro-tracker
      tls: {}
    digital-library:
      rule: Host(`library.cuatro.dev`)
      entryPoints: [websecure]
      middlewares: [library-headers]
      service: digital-library-web
      tls: {}
    # The same application's API container, under the same Host (AD-7 permits a split inside one
    # application; a Traefik service cannot carry a path rule, so this is a second router).
    digital-library-api:
      rule: Host(`library.cuatro.dev`) && (PathPrefix(`/api/`) || PathPrefix(`/files/`))
      entryPoints: [websecure]
      middlewares: [library-api-headers]
      service: digital-library-api
      tls: {}
    list-wheel:
      rule: Host(`wheel.cuatro.dev`)
      entryPoints: [websecure]
      middlewares: [house-headers]
      service: list-wheel
      tls: {}
    cs-tournament:
      rule: Host(`tournament.cuatro.dev`)
      entryPoints: [websecure]
      middlewares: [house-headers]
      service: cs-tournament
      tls: {}
    # The DNS-01 proof (AD-26). This hostname has NO DNS record, so it is never proxied and nothing
    # public reaches it; it exists so Traefik obtains and renews one public certificate over DNS-01,
    # proving the capability a hostname needs before it may leave the proxy. It is the only router that
    # names a certificate resolver. Two labels deep ON PURPOSE: Traefik requests no ACME certificate
    # for a name a loaded certificate already covers, and the Origin CA's `*.cuatro.dev` covers every
    # one-label name (observed 2026-09-30: "No ACME certificate generation required for domains").
    dns01-probe:
      rule: Host(`dns01-probe.scratch.cuatro.dev`)
      entryPoints: [websecure]
      service: noop@internal
      tls:
        certResolver: cloudflare
    # The dashboard: loopback-only entrypoint, basic auth, reached as http://localhost:8080/dashboard/
    # through an SSH tunnel. Never on websecure.
    dashboard:
      rule: Host(`localhost`)
      entryPoints: [traefik]
      middlewares: [dashboard-auth]
      service: api@internal

  middlewares:
    # The estate's header set, as the retired shared Caddyfile sent it.
    house-headers:
      headers:
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: strict-origin-when-cross-origin
    # library frames its own EPUB content, so SAMEORIGIN rather than DENY, as Caddy's block has it.
    library-headers:
      headers:
        contentTypeNosniff: true
        customFrameOptionsValue: SAMEORIGIN
        referrerPolicy: strict-origin-when-cross-origin
    # The API's own responses already carry `Referrer-Policy: no-referrer`. Caddy adds its header beside it,
    # so browsers apply the last, `no-referrer`; Traefik would replace it (Story 4-9's rehearsal,
    # `ops/backup-digital-library.md`). So the API router sets the other two only, and its own policy stands.
    library-api-headers:
      headers:
        contentTypeNosniff: true
        customFrameOptionsValue: SAMEORIGIN
    www-to-apex:
      redirectRegex:
        regex: ^https?://www\.cuatro\.dev(?::\d+)?(.*)$
        replacement: https://cuatro.dev${1}
        permanent: true
    # Traefik forwards a WebSocket upgrade with `X-Forwarded-Proto: wss`, and Caddy with `https`.
    # cs-tracker's Plug.SSL trusts that header and knows only `https` (`rewrite_on: [:x_forwarded_proto]`),
    # so without this every LiveView socket is answered 301 and the page never goes live (Story 4-10's
    # rehearsal, `ops/cs-tracker-cutover.md`). Set, not appended: websecure is TLS only, so `https` is true.
    forwarded-proto-https:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: https
    # The htpasswd line comes from TRAEFIK_DASHBOARD_USERS in the gitignored `.env`; nothing here holds it.
    dashboard-auth:
      basicAuth:
        users:
          - '{{ env "TRAEFIK_DASHBOARD_USERS" }}'

  services:
    cuatro-portfolio:
      loadBalancer:
        servers:
          - url: http://anchor-app:3000
    analytics:
      loadBalancer:
        servers:
          - url: http://anchor-umami:3000
    cs-tracker:
      loadBalancer:
        servers:
          - url: http://app:4000
    cuatro-tracker:
      loadBalancer:
        servers:
          - url: http://cuatro-app:3000
    digital-library-web:
      loadBalancer:
        servers:
          - url: http://library-web:3000
    digital-library-api:
      loadBalancer:
        servers:
          - url: http://library-api:4000
    list-wheel:
      loadBalancer:
        servers:
          - url: http://list-wheel:80
    cs-tournament:
      loadBalancer:
        servers:
          - url: http://tournament:3000

# Every proxied hostname is served the Cloudflare Origin CA certificate for cuatro.dev and *.cuatro.dev
# (AD-26), mounted read-only from Traefik's own volume `traefik-origin-ca` (`ops/traefik/compose.yml`).
tls:
  stores:
    default:
      defaultCertificate:
        certFile: /etc/traefik/origin-ca/origin.pem
        keyFile: /etc/traefik/origin-ca/origin.key
