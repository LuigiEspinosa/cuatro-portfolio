e specced Rule A + Rule B and deliberately does NOT guard format_overridden_at itself — a future story could NULL the record-side flag (the append-only audit row survives regardless); a considered boundary, flagged rather than unilaterally expanded. PRIOR CONTEXT: Story 4.2 CONTEXTED via bmad-create-story -> ready-for-dev. Pre-declared match format + tie policy = the AD-10 lock. Exhaustive analysis found the slice is SMALLER and SHARPER than it looks: Story 4.1 ALREADY shipped match.format/tie_policy/format_locked (0010:56-58) with its own header explicitly handing the LOCK to 4.2, and `declare_format` is ALREADY the enumerated audit action (0003:25 / SOLUTION-DESIGN:251 / AD-17) needing NO migration. So 4.2 adds exactly ONE column (D3 format_overridden_at) and otherwise ships TEETH: migration 0012 = two CHECKs (a locked format must be non-blank; state in (live,pending,resolved,manual_resolved) REQUIRES format_locked — bye/void/forfeit/awaiting_grace EXCLUDED on purpose, they are never played per AD-9 and requiring a format for them would make 4.1's generated bye/void rows unrepresentable and block 4.5's forfeit) + a BEFORE UPDATE trigger (format_locked is a LATCH, never true->false, else unlock->edit->relock IS the silent edit; a locked format/tie_policy changes ONLY under a transaction-local GUC that declare_match_format sets, and that flag CANNOT EXIST WITHOUT the audit row in the same txn — that is what makes 'audited override' a MECHANISM rather than a convention) + the declare_match_format RPC, lib/match/format.ts and app/api/admin/match/format/route.ts. THREE derived requirements beyond the 2 epic ACs: D1 the lock must bite SERVICE_ROLE — it holds UPDATE on match and has BYPASSRLS, and BYPASSRLS skips policies but NEVER triggers (4.1's D3 lesson applied verbatim; a route-only guard would be a convention the next story breaks with one innocent UPDATE). D2 BULK declare — an 11-player field is 30 match rows (verified at 4.1 live-QA), so a per-match-only API would need 30 HTTP calls before the first match could start and AC1 would be unreachable in practice. D3 format_overridden_at — PRD FR-10:216 ('the declared format and any manual override are VISIBLE ON THE MATCH RECORD') and EXPERIENCE:122 ('logged + FLAGGED ON THE RECORD') are NOT satisfied by an audit_log row alone. HEADLINE TRAP flagged loudly in the story: do NOT reuse the existing match.manual_override column for the format override — it is AD-5's SCORE-source flag and is READ BY score_source_guard (0010:124-128), so setting it because an admin corrected a FORMAT would silently legalize a hand-typed admin_manual score on a match that HAS a demo — exactly the failure AD-5 exists to prevent, landing before 4.6/4.8 ever run. Also pinned: format/tie_policy stay FREE TEXT, no CHECK enum — SOLUTION-DESIGN gives every other closed-set column a CHECK and gives these two none, and OQ-4 (SPINE:471) says match formats are 'organizer/content config, NOT code'; the vocabulary lives in lib/match/format.ts as an editable as-const array (adding MR8 must not require a migration), with only a non-blank guard in the DB. KNOWN REGRESSION, correct-by-design (Task 8): 0010_match_test.sql:359-368 currently lives_ok's `update match set state='live'` on an UNLOCKED match — precisely what AC1 forbids — so it MUST flip to throws_ok 23514, keeping a locked-row lives_ok for the UPDATE grant it is really testing, with the plan(N) delta accounted for. OWNERSHIP GAP surfaced for Cuatro: NO Epic-4 story claims the declared->live transition (spine lifecycle:306) — 4.3 is advance-on-result, 4.5 is bye/forfeit/grace, 4.6 is Pending->Resolved; 4.2 installs the guard anyway so whoever lands it inherits a lock they cannot bypass (the INVERSE of 4.1's D3, which deliberately waited for the writer — here the guard must PRECEDE it). No retro action item is homed to 4.2; 4.1 closed epic-2 #7 and epic-3 #3.)"
