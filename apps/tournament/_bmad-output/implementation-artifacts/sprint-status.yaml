ll plan(N) unchanged in 0010/0011/0012 (fixtures only). OPEN QUESTIONS ANSWERED: (3) an idempotent REPLAY DOES write a second `advance` audit row — the audit is a log of admin ACTIONS, not of state deltas, and a silent double-tap is exactly what AD-8 wants visible (the bracket is unchanged either way — that IS AC1's idempotency, and it is pinned); (4) the 11-player field COMPLETES. STILL FOR CUATRO: (1) the `Avanzar` control — PRD FR-7 (prd.md:185) and EXPERIENCE:87 both describe an admin tap/drag advance button, and AD-8 + the epic's AC2 both forbid an independent advance control; implemented AS AC2/AD-8 (consequence only, no route), flagged rather than decided unilaterally; (2) public vs private `tournament:<id>` — AD-11 says public, and a public topic is client-WRITABLE, so a spoofed nudge costs a wasted re-fetch (Broadcast is never the source of truth); locking it down belongs with Story 5.8, uniformly across all three channels, not bolted onto this one. DEVIATION STATED RATHER THAN BURIED: the audit `detail` carries a FOURTH key, `champion` (NULL except on the Grand Final), beyond the story's {winner_entry, loser_entry, hops}; every key is asserted. ⚠ STORY 4.4 MUST WIDEN the grand_final arm of match_routing_complete (the AD-21 reset row gives gf_order=1 a CONDITIONAL winner edge) — said so in the constraint's own comment so 4.4 does not read a red suite as a bug. GATES: pgTAP 591 (512 -> +79) / Vitest 212 (194 -> +18) / lint 0 / build 0 / go build+vet clean (the worker is untouched and was RE-CONFIRMED BY GREP, not assumed, to contain no SQL touching `match`). The story that makes the bracket MOVE. Headline finding: the double-elim ROUTING LIVES ONLY IN TYPESCRIPT (lib/bracket/generate.ts winnersWinnerTarget/winnersLoserTarget/losersWinnerTarget) and `match` has NO edge columns — but the advance must run INSIDE Story 4.6's Aprobar transaction (SOLUTION-DESIGN §8 lists it as step 3 of ONE txn), and plpgsql cannot call back out to TS to ask where a winner goes. So D1: PERSIST THE EDGES (8 structural columns — bracket/slot/gf_order/side per edge, resolved through the existing match_slot_uniq index, so no self-FK and no post-INSERT pass) and CONSUME 4.1's already-exported edge functions rather than porting `index ^ 1` to plpgsql — 4.1's header says verbatim "the routing functions below are exported precisely so 4.3 consumes them rather than re-deriving". FIVE derived requirements, three of them individually FATAL: D1 the edges (+ a match_routing_complete CHECK making a bracket with no exits unrepresentable — a row with no outbound edge is a BRICK and `match` has no DELETE grant); **D2 THE LOSER DROP** — AC1 only says "winner", but a bracket where only winners advance NEVER FILLS THE LOSERS BRACKET and NO TOURNAMENT CAN EVER COMPLETE (FR-6's two-loss elimination is DERIVED from the loser edge; the loser is not a column — it is "the competitor who is not winner_entry", NULL for a bye, which handles Bye/Forfeit/Resolved uniformly); **D3 THE BYE CASCADE** — 4.1's ALL-CAPS contract to this story by name: a player arriving at a Losers node marked `bye` must be advanced STRAIGHT THROUGH it (won unplayed) or the LB stalls at the first walkover — and the standing 11-player fixture is 30 rows of which 10 are bye/void, so this is the NORMAL path, not a corner case; D4 the `advance` audit row (already the enumerated vocabulary at 0003:25 → NO migration, same as declare_format in 4.2); and **D5 NO ADVANCE ROUTE** — AC2/AD-8 make advance a CONSEQUENCE of a result transition (Aprobar/Forfeit/Bye), "never an independent button that races publish", so 4.3 ships a SQL function that 4.5/4.6 call inside their OWN transactions: no route, no new TS module, NO DEAD CODE. Like 4.2, this story therefore has NO PRODUCTION CALLER — it is a mechanism proven at the SQL layer + live-QA. ⚠ CONFLICT FLAGGED FOR CUATRO: PRD FR-7 (prd.md:185) and the UX's {components.advance-control} (EXPERIENCE:87) BOTH describe an admin tap/drag `Avanzar` button — the architecture (AD-8) deliberately overrode it and the epic's AC2 restates AD-8 verbatim, so AC2 is implemented as written and the `Avanzar` affordance is re-read as the result-entry action (Aprobar / W.O.) belonging to 4.5/4.6 + the Epic-5 console. AC2's teeth = advance_match REFUSES any match not in (bye,forfeit,resolved,manual_resolved) with a winner → `not_resolved`; advancing a `pending` match is EXACTLY the "advance races the publish" AD-8 exists to prevent, and it is pinned by name. AC1's teeth = the write is literally the AC (`update … where competitor_X is null or competitor_X = entry`): row_count=1 → placed or replayed (BOTH success, that IS the idempotency); row_count=0 → a DIFFERENT player holds the slot → typed refusal `slot_taken`, never an overwrite (AD-8/§7: "re-routing a different winner requires an explicit rollback first" → Story 4.7). DECISION 1 (AC3, taken in-story, overrule at review): there is ZERO realtime code in the repo (grep: no channel/broadcast in app/ or lib/) and Epic 5 owns the viewer surfaces + the nudge story, so the Broadcast had to be decided here → `realtime.send()` from INSIDE advance_match, because it makes "emitted only after commit" true BY CONSTRUCTION (the message row is written in the advance's own transaction and Realtime ships it off the replication slot only on commit — it CANNOT be delivered for an advance that rolled back, and it cannot be lost by a process that dies post-commit, both of which a TS post-commit emit can), it works unchanged inside 4.6's Aprobar txn (a TS emitter has no seam there), and it ships ZERO dead code; `p_emit` (default true) exists solely so 4.6 can honour AD-11's "ONE Broadcast carries the semantic change". Fallback if Task 0 finds realtime.send absent: `channel.httpSend()` (real; landed in supabase-js 2.107.0, we are on 2.110.0). KNOWN REGRESSION, correct-by-design (Task 8): 0011_bracket_generation_test.sql's HAND-BUILT p_matches fixtures (pg_temp.matches8/matches16) omit the new edges → match_routing_complete refuses them (23514) and generation goes RED. Fix the FIXTURES by pasting real generateBracket() output (they had drifted from what the generator actually emits — the 4.1 review's headline lesson), NOT by weakening the CHECK; plan(65) delta accounted. THE BAR (Task 9): a real 11-player bracket must be driven to a CHAMPION. 4.1's live-QA drove a field the review later PROVED could never reach its Grand Final and the re-run was WAIVED — this story repays that debt or surfaces the 4.1 routing bug. Scope boundaries pinned: no declared→live (still unowned, 4.2 flagged it), no GF-reset row (4.4 — it widens the grand_final arm of the routing CHECK), no forfeit/grace (4.5), no score/Aprobar (4.6), no rollback/un-advance (4.7 — `slot_taken` is the refusal that points at it), tournament.final_match_id left DORMANT (which row is the LAST GF row is 4.4's question), no command-route helper (4.9), no CSRF (Epic 7), no UI/i18n (Epic 5). Cross-story regression to pin: advance writes competitor_*/winner_entry/state and NEVER a format column, so 0012's match_format_audited constraint trigger must NOT fire — assert an advance on a format-LOCKED match succeeds, or it only surfaces in 4.6.
  4-4-grand-final-reset-as-two-ordered-match-rows: done # CODE-REVIEWED 2026-07-14 (bmad-code-review, 3 parallel layers — Blind Hunter / Edge Case Hunter / Acceptance Auditor, all Opus 4.8; baseline eac5f51): 0 decision-needed + 2 patch + 1 defer + 3 dismissed -> BOTH PATCHES APPLIED, gates green (pgTAP 625 (+1 from the new asymmetric-refused assertion) / lint 0; Vitest/build unaffected — Patch 2 is a pure JSDoc comment). ⭐ HEADLINE, AND IT BREAKS THE 4.1/4.2/4.3 PATTERN: each of the prior three reviews found the suite proved materially LESS than it claimed; 4.4's own load-bearing claims SURVIVED verification. The Acceptance Auditor confirmed LINE-BY-LINE that both create-or-replace functions ARE 0013's body copied forward VERBATIM except the three disclosed surgical changes (generate_bracket: only 2*B-2 -> 2*B-1; advance_match: source SELECT +bracket/gf_order, the GF-1 conditional, the final_match_id write); "mutation-verified" is GENUINE, not tautological (removing the GF-1 conditional turns FOUR value-asserting TGFA assertions red — advanced/champion/seated-competitors/final_match_id — not shape-only ones); AC2 is proven LITERALLY (gf_order=1.winner_entry and gf_order=2.winner_entry are distinct rows with distinct winners, so the champion slot is never overwritten in place); and final_match_id = "the last GF row played" holds on BOTH paths and cannot latch a wrong row today. AC1/AC2/AC3 and DECISIONS A/B/C all hold. THE ONE SUBSTANTIVE FINDING (CONVERGENT — Blind Hunter + Edge Case Hunter independently): the widened match_routing_complete gf_order=1 arm was LOOSER than the constraint's own "makes a BRICK unrepresentable / the payload is NOT trusted" charter — it permitted an ASYMMETRIC row (a winner reset edge XOR a loser edge; if side B then won, one finalist would be dropped with nowhere to go and the reset would stall `declared` forever, and `match` has NO DELETE grant) and did not pin the reset edge SIDE, where the sibling `winners` arm requires BOTH edges. NOT reachable via generateBracket() (which always emits both edges correctly with the right sides), but the CHECK is precisely the DB-authority backstop against a hand-built RPC payload, and 4.4 is the one story that touches it (the story itself invited the tightening). PATCHED: the arm is now NULL-safe both-or-neither — `(winner_to_bracket is null) = (loser_to_bracket is null)` compares two booleans (never NULL), so a half-edged row evaluates to FALSE and is rejected rather than to NULL, which a CHECK would PASS — dodging the EXACT three-valued-logic trap the 4.3 review caught in the gf_order edge guard — and pins the fixed AD-21 target (winner -> grand_final/0/2/side b, loser -> /side a); both-null stays valid (the 0010 fixture). A new pgTAP throws_ok proves an asymmetric gf_order=1 row is REFUSED (0014 plan 23 -> 24), and it genuinely GUARDS the patch: under the old loose arm that row would have been accepted, so the assertion would go RED. Second patch: the stale generate.ts:365 doc comment ("the single Grand-Final row") corrected to two rows. DEFERRED (1, deferred-work.md): final_match_id = p_match_id assumes the crown always happens at the ADVANCED row — CORRECT and verified UNREACHABLE today (the only terminal rows are grand_final gf_order=2, forced `declared` never `bye`, and gf_order=1 now always carries the reset edge so it is no longer terminal — so no walkover cascades into a terminal crown and v_champ can only be set for p_match_id itself), latent only if a future story makes a terminal row walkover-reachable; robust fix is to carry the crowning row id alongside v_champ. DISMISSED (3): (1) a Blind-layer FALSE POSITIVE — a NULL winner_to_gf_order slipping the widened CHECK, already unrepresentable via match_winner_edge_gf_order (0013:128-137, which forces winner_to_gf_order in (1,2) non-null whenever an edge targets grand_final); the diff-blind layer could not see the sibling constraint; (2) the AD-21 conditional trusting the seat convention (competitor_a = WB champion) rather than loss counts — verified asserted end-to-end (0013:414-421 proves the finals route to side a/b; Vitest asserts the same), a documented assumption to re-check at Story 4.7 (rollback / manual re-seating); (3) a cosmetic Section-B/K assertion-count label, now self-consistent at plan(89). PRIOR: CONTEXTED 2026-07-14 via bmad-create-story -> ready-for-dev. The story that adds the SECOND grand-final row. Exhaustive analysis (2 parallel research agents over architecture/PRD/UX + the shipped SQL/TS, plus direct read of advance_match/generate.ts): the bracket already ships EVERYTHING except the reset row. match already carries gf_order (allowed in (1,2)), the slot-unique index already keeps gf_order 1 vs 2 distinct via coalesce(gf_order,0), and 4.3's advance_match already crowns a champion at the terminal edgeless GF row — 4.3 shipped exactly ONE gf_order=1 row (terminal, both edges NULL) and FLAGGED FOUR HAND-OFFS BY NAME in the code 4.4 edits: (1) 0013:149-151 "STORY 4.4 MUST WIDEN THE grand_final ARM ... widen the arm, do not weaken the CHECK"; (2) generate.ts:438-440 "the AD-21 reset row (gf_order=2) is Story 4.4's"; (3) 4.3 story :439-442 tournament.final_match_id "Leave it dormant. Which row is the LAST GF row is 4.4's question"; (4) 0013_advance_test.sql:116-123 the pg_temp.mid/comp helpers were pre-parameterised with gf int default 0 SPECIFICALLY so 4.4's reset row does not abort the whole file. THE MECHANISM: side A of gf_order=1 is ALWAYS the Winners champion (0 losses, via winnersWinnerTarget->side a) and side B ALWAYS the Losers survivor (1 loss, via losersWinnerTarget->side b). If side A wins game 1 -> champion outright, NO reset. If side B wins -> both go to gf_order=2 (A->side a, B->side b), and the winner of that terminal edgeless row is champion by 4.3's existing rule. Two SEPARATE rows = the champion slot is a different column on a different row across the two games, never overwritten in place (that IS AD-21, closing adversarial H4: without it a reset writes ONE slot twice with different winners and AD-8's WHERE-guard cannot tell reset from double-route). DERIVED WORK (no new columns): widen match_routing_complete grand_final arm to permit gf_order=1 conditional edges while gf_order=2 stays terminal (migration 0014, keep else false, keep every arm named — 4.3 lesson); emit the gf_order=2 reset row + gf_order=1's two conditional edges (winner->gf/2/side b, loser->gf/2/side a) as DATA in generate.ts (AD-21: routing is data not branching); bump generate_bracket skeleton count 2B-2 -> 2B-1 (create-or-replace, IDENTICAL signature to preserve grants); add the GF-1 conditional in advance_match (side A wins -> v_champ, skip reset edges; side B -> fall through to normal edge-following) reading v_m.bracket/gf_order/competitors; set tournament.final_match_id = crowning match id when v_champ is set. gf_order=2 must be `declared` NOT `void` (advance_match:716-724 RAISES on void). THREE IN-STORY DECISIONS (overrule at review): (A) advance_match sets final_match_id when it crowns — RECOMMENDED (v_champ already computed there; AD-13 fair_seed needs it); (B) reset row ALWAYS generated declared+edgeless, forced by the edge-resolution guard + no-DELETE-grant + single-shot generation; (C) tournament.state does NOT change here (ceremony is an audited admin transition, Epic 6). KNOWN REGRESSION (the 4.3 lesson, mandated): the skeleton-count bump makes generate_bracket reject the old 2B-2 golden fixtures (matches11 in 0013 test, matches8/16 in 0011 test) -> fix the FIXTURES from real generateBracket() output, NEVER weaken the count; Section B's GF-CHECK assertion INVERTS (widened arm) -> update the assertion not the constraint. MANDATE: mutation-test the suite (delete the GF-1 conditional -> must go RED). THE BAR (Task 8): drive a real bracket to a champion THROUGH a reset over the supabase-js->PostgREST->RPC seam, both GF outcomes, AC2 proven literally (gf_order=1.winner_entry and champion are distinct rows). No production caller (like 4.2/4.3); no UI (Epic 5). Migration slot 0014_grand_final_reset.sql; test 0014_grand_final_reset_test.sql.
