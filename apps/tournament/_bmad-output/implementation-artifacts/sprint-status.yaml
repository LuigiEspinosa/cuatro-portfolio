  4-3-idempotent-conditional-advance: done # CODE-REVIEWED 2026-07-14 (bmad-code-review, 3 parallel layers, Opus 4.8; baseline 7208608): 3 decision-needed + 16 patch + 7 defer + 2 dismissed -> ALL 3 DECISIONS RESOLVED AND ALL 16 PATCHES APPLIED. Gates: pgTAP 599 (591 -> +8; 0013 plan 79 -> 87) / Vitest 212 / lint 0 / build 0 / go clean. ⭐ HEADLINE: ALL THREE ACs AND D1-D5 HELD AS MECHANISMS — the story is good work — BUT THREE OF ITS OWN LOAD-BEARING CLAIMS WERE FALSE, AND EACH WAS PROVEN BY EXECUTION, NOT ARGUED. (1) "Locks are taken in TOPOLOGICAL order, so two concurrent advances cannot deadlock" — FALSE: `40P01 deadlock detected` reproduced against the real function. Walking the DAG from a source is a BFS order, not a topological order: the WINNERS FINAL's winner edge points at the GRAND FINAL and its loser edge at the LOSERS FINAL, which is itself a PARENT of the GF — so advancing the WF locked (WF->GF->LF) while a concurrent advance of the LF locked (LF->GF). Reachable in ordinary play, because AC1 explicitly SUPPORTS the idempotent replay that races it, and because advance_match runs INSIDE 4.6's Aprobar txn the victim would lose its whole approval to an untyped 500. FIXED by taking every lock in ONE statement in canonical id order, up front — a cycle is now impossible BY CONSTRUCTION rather than by an argument about the DAG's shape, which is precisely the argument that was wrong. (2) "match_place_competitor … its contract is AC1's literal SQL" — FALSE, and FOUND INDEPENDENTLY BY ALL THREE LAYERS. The SET wrote THREE columns (competitor_a, competitor_b, winner_entry) but the WHERE guarded only the SEAT named by p_side. Reproduced as service_role: crowning a DIFFERENT arrival on the free seat of a bye ALREADY WON by X returned TRUE and silently DEPOSED X (match_winner_is_competitor does not catch it — the usurper IS a competitor by then), and a NULL entry (the shape a bye's non-existent loser trivially produces) returned TRUE while ERASING winner_entry. That is the exact double-route AD-8 exists to prevent, performed by the function the story calls "literally the AC" — and the migration GRANTS it to service_role while the suite explicitly tells 4.5/4.6 to call it "WITHOUT pass 1 in front of it". FIXED: the predicate now guards the winner too, and a NULL entry raises. (3) ⭐⭐ THE LESSON, AND IT IS THE THIRD STORY RUNNING: the story mutation-tested AC1's predicate, found it untestable, wrote Section L to fix it — AND SHIPPED THE IDENTICAL HOLE ON AC2. Every Section-D fixture had winner_entry IS NULL, and advance_match's two gates return a BYTE-IDENTICAL payload, so DELETING THE ENTIRE AC2 RESULT-STATE GATE LEFT ALL 79 ASSERTIONS GREEN — including the flagship "⭐ a `pending` match is REFUSED — the AD-8 case, PINNED BY NAME". With the gate deleted, advance_match on a PENDING match holding a winner returned {"ok":true,"advanced":2} and MOVED THE BRACKET OFF UNPUBLISHED STATS. The code was right; the suite was blind to it. FIXED: a `pending` match WITH a winner is now fixtured and asserted (Section D +1), and Section M (+3) asserts the winner guard. ⭐ THE PATCHES ARE MUTATION-VERIFIED, NOT MERELY GREEN: re-injecting the AC2 gate deletion now turns 5 RED (was 0); removing the winner guard turns 2 RED (was 0); the concurrent WF/LF advance now serialises cleanly instead of deadlocking. ALSO PATCHED: generate_bracket never checked that its edges RESOLVE, so ONE typo'd edge committed a `bracket_live` tournament that every advance could only RAISE on — unrecoverable (`match` has NO DELETE grant; generation refuses to re-run) — now validated AGAINST THE PAYLOAD and BEFORE the INSERT, so a refusal still writes nothing; the CHAMPION emitted NO Broadcast (the emit was gated on `v_hops > 0` = planned PLACEMENTS, and the GF plans zero) while a no-op REPLAY emitted twice — the suite asserted BOTH as desired; the edge gf_order CHECK constrained NULL-ness but not the VALUE (⚠ and the fix needed `is not null AND in (1,2)` — `NULL in (1,2)` is NULL and a CHECK PASSES on NULL; the existing suite caught that trap the instant it was introduced, which is the suite earning its keep); match_routing_complete's `else` arm was a CATCH-ALL, so a future 4th bracket value would have been BORN A BRICK; Section B's seven throws_ok checked only SQLSTATE 23514 (all TEN of match's CHECKs raise it) — the exact hazard this story documents at length in the 0010/0011/0012 fixtures and then reproduced in its own new file; Section D's "seated ZERO competitors" read only competitor_a while the drop it guards targets side B; Section G asserted the plan COUNT, never that the winner ARRIVED; and pg_temp.mid/comp did not key on gf_order, so they would have ABORTED THE ENTIRE FILE the moment Story 4.4 lands its reset row (and it would have looked like 4.4's bug). DECISIONS (Cuatro): (1) the migration CANNOT APPLY to a DB already holding a bracket — an immediate VALIDATED check over eight un-backfilled nullable columns, PROVEN (`23514 … is violated by some row`), and `supabase db reset` STRUCTURALLY CANNOT CATCH IT -> resolved SAFE (the remote has never generated a bracket) and downgraded to a header note, with the ⚠ recorded that a deployed DB holding bracket rows must CLEAR AND REGENERATE, never SQL-backfill the edges (that would mean re-deriving `index ^ 1` in plpgsql — the one thing this migration exists to forbid); (2) the `Avanzar` control -> AD-8 STANDS, keep as shipped (AC2 is a real MECHANISM, not a convention: the DB result gate refuses a `pending` match for EVERY caller, so even a future route could not reintroduce the race — this is STRONGER than 4.2's precedent); (3) public vs private `tournament:<id>` -> DEFERRED to 5.8, uniformly across all three channels. WHAT HELD, AND WAS RE-VERIFIED RATHER THAN TRUSTED: the TWO-PASS design (invented during implementation, never specced) is SOUND — pass 1's approval condition is a strict SUPERSET of pass 2's predicate, so the asymmetry runs the safe way; D1 keeps exactly ONE routing implementation (no `index ^ 1` in SQL anywhere); D2's loser expression is correct across all four competitor/winner NULL arrangements; D3's cascade terminates (max ONE walkover hop for any field 8-16; the cap of 32 is ~10x generous); the 0012 format lock genuinely does not bite; the fixture edits to 0010/0011/0012 do NOT make any pre-existing test pass for the wrong reason; plan(79) and the 591/212 arithmetic were exact; 23 of 24 sampled citations accurate; and D5 confirmed INDEPENDENTLY by grep (zero advance route, zero `Avanzar`). TWO FALSE POSITIVES KILLED IN TRIAGE: the Blind Hunter claimed the `index ^ 1` crossover was untested — DISPROVEN BY MUTATION (Story 4.1 already ships a property test; inverting the crossover turns it RED, 2 failed / 210 passed — he was diff-blind and could not see it); and his NULL-state-fails-open finding is unreachable (`match.state` is `not null`, 0010:64-65 — he honestly caveated it himself). DEFERRED (7, in deferred-work.md): AC1 binds one FUNCTION not the TABLE (service_role can seat any competitor with a bare UPDATE — the same shape as 4.2's headline finding; the fix needs 4.7's un-advance design, because a naive write-once trigger would BLOCK the rollback); a returned {ok:false} does NOT roll back the CALLER's txn and nothing requires it to (-> 4.5/4.6 must honour it, and the contract was unwritten); realtime.messages is DAY-PARTITIONED BY A BACKGROUND JOB and realtime.send SWALLOWS ITS OWN ERRORS, so in PRODUCTION a missing partition makes AC3 fail SILENTLY — the dev diagnosed this correctly and fixed it only IN THE TEST (-> 5.8 + Epic-7 ops); five bare P0001 raises (-> 4.5, joining the existing P0001-ambiguity item); advance_match never checks tournament.state (-> 4.7); the advance audit row carries no before/after though AD-17's letter asks for one (-> 4.7, the first consumer that will want it); and public-vs-private `tournament:<id>` (-> 5.8). NOT RE-EXECUTED: the full Task-9 live-QA drive to a champion — the advance_match SIGNATURE is unchanged so the supabase-js -> PostgREST -> RPC seam still holds, and the DB layer was proven ADVERSARIALLY AND BY MUTATION, which is strictly more than the original sign-off did; the lock-acquisition change was verified directly with two concurrent live sessions (no deadlock, clean serialisation). PRIOR: IMPLEMENTED 2026-07-14 via bmad-dev-story; baseline 7208608. 🏆 THE BAR IS MET: a REAL 11-PLAYER BRACKET WAS DRIVEN TO A CHAMPION over the production supabase-js -> PostgREST -> RPC seam (30 rows, 9 bye + 1 void, 20 formats locked via the real 4.2 RPC, 21 advances, 4 walkover cascades, 0 byes left un-walked, 0 voids touched, 13/14 Losers nodes filled, 21 audit rows, exactly ONE champion). The debt 4.1's WAIVED live-QA left open is REPAID, and 4.1's routing is vindicated — no routing bug was surfaced. AC3 proven BOTH ways live: a real ANON WebSocket subscriber received 20 `bracket.advanced` broadcasts on the public channel, AND a rolled-back advance had its message row discarded with the transaction (21 inside the open txn -> 20 after rollback) — the emit cannot outrun its own commit. Task 0 PASSED (realtime.send exists -> Decision 1(a) stands, the TS httpSend fallback was not needed); it also surfaced that realtime.messages is DAY-PARTITIONED BY A BACKGROUND JOB, and since realtime.send swallows its own errors a missing partition would have made AC3 fail SILENTLY -> the suite now guarantees its own precondition rather than trusting a background job. Migration 0013_advance.sql = D1 (eight STRUCTURAL routing columns — bracket/slot/gf_order/side per edge, resolved through the existing match_slot_uniq index, so NO self-FK and NO post-INSERT pass and the completeness CHECK stays an ordinary immediate CHECK) + match_routing_complete (a bracket row with no outbound edge is a BRICK and `match` has NO DELETE grant, so it is made UNREPRESENTABLE) + `create or replace generate_bracket` (IDENTICAL signature, so the 0011 EXECUTE grants survive; the ONLY change is the INSERT) + match_place_competitor (AC1's predicate, written ONCE, called from all four placements) + advance_match (AC2's result gate incl. `pending` PINNED BY NAME as the AD-8 "advance races the publish" case; D2 the loser drop; D3 the bye cascade; D4 the audit row; AC3 realtime.send, post-commit BY CONSTRUCTION). The routing keeps EXACTLY ONE implementation — TS emits the edges by CALLING 4.1's already-exported functions; there is no `index ^ 1` anywhere in SQL. NO ROUTE AND NO `Avanzar` BUTTON (D5/AC2 — confirmed by the build's route list). ⭐ A DESIGN POINT THE STORY DID NOT SPECIFY AND IT IS LOAD-BEARING: advance_match IS TWO PASSES. A typed refusal RETURNS — it does not raise — so it does NOT roll the caller's transaction back; a one-pass advance that placed the winner and THEN hit slot_taken on the loser drop would hand the caller {ok:false} with A HALF-APPLIED ADVANCE COMMITTED UNDERNEATH IT. So pass 1 walks the whole cascade READ-ONLY (taking FOR UPDATE on every row it resolves, so the plan cannot go stale) and validates every placement; pass 2 applies them. A refusal has written NOTHING. Locks are taken in TOPOLOGICAL order (a node before its successors — the only direction the DAG is walked), so two concurrent advances cannot form a cycle. ⭐⭐ MUTATION TESTING FOUND A REAL HOLE IN MY OWN SUITE, AND THIS IS THE FINDING WORTH KEEPING: four defects were injected into the shipped SQL — removing the LOSER DROP (7 red, incl. "D2: THE LOSER DROPPED"), removing the BYE CASCADE (4 red, incl. "D3 …AND THEY DID NOT STOP THERE"), and ONE-PASS writes (1 red, "THE WINNER WAS NOT PLACED EITHER") — but DELETING ACCEPTANCE CRITERION 1 ITSELF (the `WHERE slot IS NULL OR = winner` predicate) LEFT ALL 76 ASSERTIONS GREEN. The cause is structural: advance_match's pass-1 validation reaches the same verdict first, so by the time pass 2 calls the helper the seat is already known free (or already ours) and the predicate never gets to decide anything. It is a genuine backstop — the