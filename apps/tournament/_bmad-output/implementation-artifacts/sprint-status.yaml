  - epic: 3
    action: "Carry the two deferred FKs (demo_match_fk + stat_row_match_fk, deferred since 3.1/3.3) + the roster-lock TOCTOU (epic-2 #7) into Epic 4's match/bracket slice as first-class planning items. DONE 2026-07-12 (Story 4.1, D1 + D3) — but NOT in the shape the implementation first took; the code review corrected it. Migration 0010 created `match` and closed ALL FOUR deferred -> match(id) FKs (not just the two named here): demo RESTRICT + stat_row CASCADE + tournament.final_match_id and audit_log.target_match_id SET NULL (never CASCADE — an append-only audit must not be cascade-wiped). CRITICAL CORRECTION from the code review: the FKs could NOT go on the existing demo.match_id / stat_row.match_id columns — those NEVER held a match(id). Every writer supplies an EXTERNAL id (the worker writes MatchZy's game-server matchid / the CLI's --match; lib/ingest.ts validates only 'positive integer'), so FK-ing them 23503'd every demo ingest and every parse at RUNTIME (500 + an orphaned R2 object on each MatchZy retry), and the standing Epic-3 ingest fixture — which seeds zero match rows — became unrunnable. Resolution (Cuatro, decision 2c): RENAME the columns to matchzy_match_id and put the FKs on a NEW, NULLABLE match_id that Story 4.6 (Aprobar) populates when it binds a demo to the match it decided. The RENAME is load-bearing: it carries 0006's unique(match_id, demo_sha256) and 0007's unique(match_id, steamid64) with it, so the AD-3 dedup + re-parse keys keep working on exactly the values they always deduped on — an add-and-null would have SILENTLY destroyed demo dedup and turned every re-parse into duplicate rows (NULLs are DISTINCT in a UNIQUE). Consequences: ingest works, 0010 applies cleanly to a DB holding 3.x demo/stat_row rows (no `db reset` needed, and the earlier 'migration-apply caveat' is void), and the 0005-0009 pgTAP re-fixturing the implementation added became unnecessary and was REVERTED to baseline (retiring the pg_temp.m helper). The TOCTOU guard shipped