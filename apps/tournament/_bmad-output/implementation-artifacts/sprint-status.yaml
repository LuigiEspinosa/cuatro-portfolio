ormat_overridden_at + wrote a 2nd audit row with before/after, the GUC did NOT leak (a plain edit right after the RPC was still refused — the single most load-bearing assertion), and a bulk re-run refused no_eligible_matches writing nothing. NOTE for review: the trigger implements exactly the specced Rule A + Rule B and does NOT guard format_overridden_at itself (a future story could NULL the record-side flag; the append-only audit row survives regardless) — a considered boundary, flagged not fixed. ENV NOTE: WinNAT swallowed DB port 54322 on db reset (excluded range 54307-54406); fixed by an elevated `net stop winnat; net start winnat` — NO repo file was changed to work around it. Will recur on this box. Small, sharp slice: 4.1 ALREADY shipped match.format/tie_policy/format_locked (0010:56-58) and named 4.2 as their owner, and `declare_format` is already the enumerated audit action (0003:25) — so 4.2 adds no columns except D3's format_overridden_at and builds the LOCK: 2 CHECKs (a locked format must be non-blank; state in live/pending/resolved/manual_resolved REQUIRES format_locked — bye/void/forfeit/awaiting_grace deliberately EXCLUDED, they are never played per AD-9) + a BEFORE UPDATE trigger (format_locked is a LATCH, never true->false; a locked format/tie_policy changes ONLY under a txn-local GUC that declare_match_format sets and that cannot exist without the audit row in the same txn) + the declare_match_format RPC/lib/route. THREE derived requirements: D1 the lock must bite service_role (BYPASSRLS skips policies, NEVER triggers — 4.1's D3 lesson); D2 bulk declare (an 11-field = 30 match rows; per-match-only would need 30 calls before any match could start); D3 format_overridden_at, because PRD FR-10:216 + EXPERIENCE:122 require the override be VISIBLE ON THE MATCH RECORD, not just in audit_log. HEADLINE TRAP flagged: do NOT reuse match.manual_override for this — it is AD-5's SCORE-source flag and is read by score_source_guard (0010:124-128), so setting it for a format fix would silently legalize a hand-typed score on a demo-bearing match. KNOWN REGRESSION (Task 8, correct-by-design): 0010_match_test.sql:359-368 currently lives_ok's `update match set state='live'` on an UNLOCKED match — exactly what AC1 forbids — so it must flip to throws_ok 23514 + keep a locked-row lives_ok for the grant. Also flagged: NO Epic-4 story owns the declared->live transition (spine 306); 4.2 guards it regardless.
