  4-8-manual-score-override-manual-side-of-fr-16: done # ⭐ CODE-REVIEWED + APPROVED 2026-07-19 (bmad-code-review, baseline 07ec695; Blind Hunter + Edge Case Hunter + Acceptance Auditor, all Opus 4.8, + reviewer verification against source). BOTH ACs HOLD. 1 decision-needed · 3 patches ALL APPLIED · 2 deferred · 4 dismissed. ⭐⭐ THE HEADLINE, caught INDEPENDENTLY BY ALL THREE LAYERS + reviewer verification of the template asymmetry: the new match_manual_override_audited constraint trigger closed the silent-override hole at the override TRANSITION but NOT on a LATER score edit of an already-overridden row — its `when` fired only on `old.score_source/manual_override IS DISTINCT FROM new`, so a raw `update match set score_a=99` that left score_source+manual_override untouched slipped through un-audited (score_source_guard still passes; match_terminal_state_guard IC904 only blocks state flips, not a score-only edit that keeps state=manual_resolved). AD-5's literal "a matching audit_log row exists" then read FALSE (the surviving row describes 16, the match shows 99). This is the exact "set once, edit many" hole the migration's own comment (0019:96-98) CLAIMED to close, and the cited template match_format_audited DOES close it with a SECOND `when` disjunct (0012:232 — `or (old.format_locked and (new.format/tie_policy distinct))`) the score trigger omitted. Reachable by raw service_role/postgres only (the RPC never does a 2nd write; re-resolve is refused not_manual_resolvable) — but binding even a raw service_role writer is the WHOLE point of the trigger class (DECISION C). Cuatro chose HARDEN (option 1): added the analogous disjunct `or (old.manual_override and (new.score_a/score_b/winner_entry distinct from old))` — one clause, mirrors the format template, and a properly-audited re-resolve still passes (it writes its matching audit row first). MUTATION-VERIFIED BY EXECUTION: the new later-edit IC907 pgTAP probe (G4) RED against the pre-hardening trigger (test 38 "caught: n