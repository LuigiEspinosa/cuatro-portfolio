last_updated: "2026-07-12 (Story 4.1 CODE-REVIEWED via bmad-code-review — 3 parallel adversarial layers at Opus capability; baseline d8c5277. VERDICT: a CRITICAL defect all three layers found independently and I confirmed by EXECUTING the shipped routing functions — a bye produces a winner but NO LOSER, yet the full Losers skeleton was emitted anyway, so the Losers slots waiting on those non-existent losers stayed empty forever: for EVERY field of 9-15 the Grand Finals side B was unreachable and the tournament could not complete (one bye at N=15 sufficed to strand the whole LB spine). Only N=8/16 worked. Story 4.3 could NOT have fixed it (4.3 advances on a RESULT; a bye never produces one). Task-9 live-QA passed only because it drove N=11 and checked the Winners side + row counts. SECOND: D1s demo_match_fk broke demo ingest at RUNTIME — demo.match_id never held a match(id) (the worker writes MatchZys game-server id), so every ingest would 23503 -> 500 and orphan an R2 object on retry; the standing Epic-3 ingest fixture seeds zero match rows and was unrunnable. TRIAGE 2 decision-needed / 9 patch / 3 defer / 3 dismissed; Cuatro resolved both decisions -> 11 patches, ALL APPLIED. Decision 1(a): byes now PROPAGATE — generateBracket settles every Losers nodes structural fate in topological order (declared=2 arrivals / bye=1 walkover / void=0, a NEW match state); verified by execution N=8..16 ALL complete, row-count invariant 2*bracketSize-2 preserved; the contract 4.3 must honour (advance straight THROUGH a bye Losers node) is documented in lib/bracket/generate.ts. Decision 2(c): demo/stat_row match_id RENAMED to matchzy_match_id — a RENAME not an add, because it carries 0006s unique(match_id,demo_sha256) + 0007s unique(match_id,steamid64) with it; adding-and-nulling would have SILENTLY destroyed demo dedup and turned every re-parse into duplicate rows (NULLs are DISTINCT in a UNIQUE). D1s four FKs now sit on a new NULLABLE match_id that Story 4.6/Aprobar populates. Ingest works again, 0010 applies to a dirty DB, and the 0005-0009 re-fixturing became unnecessary and was REVERTED (retiring the pg_temp.m deferral). ALSO: generate_bracket now validates its payload (bad_skeleton — an empty p_matches used to commit a LIVE tournament with NO bracket, unrecoverable; bad_seeds — a non-permutation used to commit); the route reports the DBs committed counts, not matches.length; the D3 triggers P0001 maps to locked/409 not 500 (the one path D3 exists for was reporting a server crash); the trigger guards BOTH ends of a tournament move; the Losers crossover is index^1 (kills 4 avoidable 16-bracket rematches, verified by simulation); match gained gf_order-domain + winner-is-a-participant + distinct-competitor + tournament-scoped-competitor constraints; and the suites now assert COLUMN VALUES (a broken JSONB key would have left the old suite fully green), persist a real bye/void row, pin the FOR KEY SHARE / FOR UPDATE modes at source level, and actually check the active-roster filter. GATES: pgTAP 12 files/433 assertions PASS (was 397), Vitest 12/170 PASS (was 146), lint 0, build 0, go build/vet/test + gofmt clean. STATUS -> done. LIVE-QA CAVEAT, recorded plainly rather than dropped: the review RECOMMENDED re-running Task 9 (the original sign-off drove the very 11-player field that could not complete, and the demo/stat_row schema changed since), and Cuatro WAIVED the re-run and accepted the story as done. The automated gates passed and the liveness fix is verified by executing the real routing functions across every field 8-16 — but the Task-9 HUMAN gate was NOT re-executed. If a real bracket ever behaves oddly, start there; a re-run should check that the Losers bracket is fully populated with bye/void states on an 11-field, that a demo ingest still succeeds post-0010, and that a roster write racing a generate returns 409 locked (not 500). Two deferrals recorded in deferred-work.md (a third — the pg_temp.m helper — was retired by the fix itself).)"
