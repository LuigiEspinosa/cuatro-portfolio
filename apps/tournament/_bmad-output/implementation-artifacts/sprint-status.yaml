0} was reported to the admin as a successful declare; match_ids was unbounded (capped at 256); and 0010_match_test.sql's fixture latched a format by RAW UPDATE, which the new gate correctly refuses -> it now INSERTs a pre-locked row instead (INSERT is deliberately ungated: 0011's generation creates every row unlocked, and 0012's two CHECKs already bind an INSERT), plan(69) unchanged. WHAT HELD, AND WAS RE-VERIFIED RATHER THAN TRUSTED: AC1 was SATISFIED all along -- the two CHECKs are CONSTRAINTS, not policies, so BYPASSRLS is irrelevant to them and no flag opens them, and they bind every writer; D2 (bulk) satisfied; D3's column present and the HEADLINE TRAP correctly avoided (manual_override was NOT hijacked -- it is AD-5's SCORE-source flag, read by score_source_guard, and setting it for a format fix would have silently legalized a hand-typed score on a demo-bearing match); Rule A (the latch) genuinely bites, even under a forged GUC; no scope creep whatsoever; and the Acceptance Auditor independently re-ran EVERY gate and verified EVERY ONE of the story's ~30 line citations as accurate. NOT RE-EXECUTED: the full Task-9 HTTP live-QA on the standing 11-player fixture. The declare_match_format SIGNATURE is unchanged (same name, same 6 args), so the supabase-js -> PostgREST -> RPC seam proven at the original Task-9 run still holds, and the lib's exact RPC payload is pinned argument-by-argument in Vitest; the DB layer -- where AC1/AC2/D1/D3 actually live -- was proven LIVE and ADVERSARIALLY, which is strictly MORE than the original sign-off did. DEFERRED (3, all in deferred-work.md): P0001 is PL/pgSQL's GENERIC exception code, so lib/match/format.ts's already_locked mapping will misfire the moment a SECOND match trigger raises it (-> Story 4.5's state machine; not reachable today, verified); nothing in TypeScript maps 23514, so whoever lands the declared->live transition owes a friendly 'declare the format first' refusal (BY DESIGN -- 4.2 lands the guard BEFORE the writer, the inverse of 4.1's D3, so the transition is born safe); and app/api/admin/bracket/route.ts carries the same unbounded-integer gap (pre-existing to Story 4.1 -> fix centrally in 4.9's shared body-parse helper rather than piecemeal). PRIOR CONTEXT: Story 4.2 IMPLEMENTED via bmad-dev-story -> review; baseline_commit 5b398ec. The AD-10 format lock now has TEETH. Migration 0012_format_lock.sql adds exactly ONE column (D3 format_overridden_at — because PRD FR-10:216 and EXPERIENCE:122 require the override be VISIBLE ON THE MATCH RECORD, which an audit_log row alone does not satisfy) and otherwise ships enforcement: two CHECKs (match_format_lock_complete — a lock must lock something NON-BLANK, without which format_locked=true with format=NULL would satisfy the live-gate while having declared NOTHING; and match_live_requires_locked_format — state in live/pending/resolved/manual_resolved REQUIRES format_locked, with bye/void/forfeit/awaiting_grace EXCLUDED on purpose per AD-9 and ALL FOUR PINNED in pgTAP so a future 'helpful' tightening that would break 4.1's generated bye/void rows and 4.5's forfeit turns the suite RED) + the match_format_lock BEFORE UPDATE trigger (Rule A: format_locked is a LATCH — without it the silent edit is trivially reachable as unlock->edit->relock leaving NO audit trace; Rule B: a locked format/tie_policy changes ONLY under the transaction-local GUC inclusivcup.format_override, which ONLY declare_match_format sets, and which CANNOT EXIST WITHOUT the audit_log row landing in the same transaction — THAT is what makes 'audited override' a MECHANISM rather than a convention) + the declare_match_format RPC (bulk / targeted / audited-override; typed refusals RETURNED not raised; EVERY guard before ANY write; one audit row PER MATCH with target_match_id populated — the FIRST rows in the codebase to do so). Plus lib/match/format.ts (the editable as-const catalog: formats stay FREE TEXT per OQ-4, so adding MR8 is a one-line TS change with NO migration