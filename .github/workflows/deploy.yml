name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # The host is whatever SERVER_HOST resolves to. This workflow cannot verify
      # which provider that is, so it does not name one.
      - name: Deploy over SSH to SERVER_HOST
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/cuatro-portfolio
            git pull origin main
            docker compose --env-file .env.production up --build -d
